<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>終點之前 2.0</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#0f172a,#243b55);color:#f8fafc;font-family:system-ui,'Microsoft JhengHei',sans-serif}
    main{width:min(100%,570px);padding:28px;border:1px solid #46546d;border-radius:22px;background:#19263d;box-shadow:0 22px 55px #0005}h1{margin:0 0 4px;font-size:1.7rem;text-align:center}.sub{text-align:center;color:#b6c5dd;margin:0 0 20px}
    .cover{width:140px;height:140px;margin:0 auto 17px;border-radius:20px;background:linear-gradient(135deg,#5378bb,#8674c7);display:grid;place-items:center;font-size:64px}
    #songTitle{text-align:center;font-size:1.2rem;font-weight:700;margin:0 0 14px}#seek{width:100%;accent-color:#8db8ff;cursor:pointer}.times{display:flex;justify-content:space-between;color:#bfcee4;font-size:.82rem}
    .controls{display:flex;align-items:center;justify-content:center;gap:15px;margin:14px 0 20px}button{cursor:pointer;color:#fff;border:1px solid #63718d;background:#33445f;border-radius:999px;padding:10px 17px;font-size:1.05rem}button:hover{background:#456080}#play{background:#d8e8ff;color:#17243b;font-size:1.4rem;min-width:60px;min-height:60px}
    .volume{display:flex;gap:10px;align-items:center;color:#ced9e9}.volume input{flex:1;accent-color:#8db8ff}h2{font-size:1.05rem;margin:24px 0 10px}
    #playlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}#playlist button{display:flex;text-align:left;align-items:center;gap:12px;border-radius:10px;width:100%;font-size:1rem}.track-number{color:#b9cdec;min-width:28px}.active{background:#41649c!important;border-color:#a3c5f8!important}
    #message{min-height:1.5em;color:#ffd7aa;font-size:.9rem}footer{text-align:center;color:#aebed4;font-size:.8rem;margin-top:22px}
    @media(max-width:480px){body{padding:12px}main{padding:20px}.cover{width:120px;height:120px}}
  </style>
</head>
<body>
  <main>
    <h1>🎵 終點之前 2.0</h1>
    <p class="sub">手機、電腦都能線上收聽</p>
    <div class="cover" aria-hidden="true">♫</div>
    <p id="songTitle">準備播放</p>
    <audio id="audio" preload="metadata"></audio>
    <label for="seek">播放進度</label>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放進度">
    <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
    <div class="controls">
      <button id="prev" type="button" aria-label="上一首">⏮</button>
      <button id="play" type="button" aria-label="播放">▶</button>
      <button id="next" type="button" aria-label="下一首">⏭</button>
    </div>
    <div class="volume"><label for="volume">🔊 音量</label><input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></div>
    <h2>播放清單</h2>
    <ul id="playlist"></ul>
    <p id="message" role="status"></p>
    <footer>使用 HTML5 Audio 製作 · GitHub Pages · 
	 <a href="https://www.youtube.com/@alan9956"
     target="_blank"
     rel="noopener noreferrer">
    RWEPA(小明)教學頻道
  </a></footer>
  </main>
  <script>
    // 只需修改這個陣列，就能新增、刪除或重新命名歌曲。
    const songs = [
      { title: '第1章 何謂圓滿結局', file: 'mp3_music/before_the_finish_line_chapter01.mp3' },
      { title: '第2章 從圓滿與未圓滿結局者的教訓', file: 'mp3_music/before_the_finish_line_chapter02.mp3' },
      { title: '第3章 精於圓滿結局的人生智慧', file: 'mp3_music/before_the_finish_line_chapter03.mp3' },
	  { title: '第4章 多面向人生旅程:設定心靈界線', file: 'mp3_music/before_the_finish_line_chapter04.mp3' },
	  { title: '第5章 保護我們免受敵人侵害的策略', file: 'mp3_music/before_the_finish_line_chapter05.mp3' },
	  { title: '第6章 圓滿結局五個標誌及屬靈資產', file: 'mp3_music/before_the_finish_line_chapter06.mp3' },
	  { title: '第7章 圓滿結局的秘訣', file: 'mp3_music/before_the_finish_line_chapter07.mp3' },
	  { title: '第8章 以神為中心的敬拜', file: 'mp3_music/before_the_finish_line_chapter08.mp3' },
	  { title: '第9章 創造改變-在校園留下生命足跡', file: 'mp3_music/before_the_finish_line_chapter09.mp3' },
	  { title: '第10章 學生生命故事分享', file: 'mp3_music/before_the_finish_line_chapter10.mp3' }
    ];
    const audio = document.getElementById('audio');
    const title = document.getElementById('songTitle');
    const list = document.getElementById('playlist');
    const playBtn = document.getElementById('play');
    const seek = document.getElementById('seek');
    const message = document.getElementById('message');
    let current = 0;
    const format = seconds => Number.isFinite(seconds) ? `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2,'0')}` : '0:00';
    function renderList(){
      list.replaceChildren();
      songs.forEach((song,i)=>{
        const li=document.createElement('li');
        const button=document.createElement('button');
        button.type='button';
        button.className=i===current?'active':'';
        button.setAttribute('aria-label',`播放 ${song.title}`);
        const number=document.createElement('span');
        number.className='track-number'; number.textContent=String(i+1).padStart(2,'0');
        const label=document.createElement('span'); label.textContent=song.title;
        button.append(number,label);
        button.addEventListener('click',()=>loadSong(i,true));
        li.append(button);list.append(li);
      });
    }
    async function start(){
      try{message.textContent='';await audio.play();}
      catch(e){message.textContent='無法播放：請確認 MP3 檔案路徑與格式，並點擊播放鍵重試。';}
    }
    function loadSong(index,autoplay=false){
      current=(index+songs.length)%songs.length;
      audio.src=songs[current].file;
      title.textContent=songs[current].title;
      seek.value=0;
      document.getElementById('currentTime').textContent='0:00';
      document.getElementById('duration').textContent='0:00';
      message.textContent='';renderList();
      if(autoplay)start();
    }
    playBtn.addEventListener('click',()=>audio.paused?start():audio.pause());
    document.getElementById('prev').addEventListener('click',()=>loadSong(current-1,true));
    document.getElementById('next').addEventListener('click',()=>loadSong(current+1,true));
    audio.addEventListener('play',()=>{playBtn.textContent='⏸';playBtn.setAttribute('aria-label','暫停');});
    audio.addEventListener('pause',()=>{playBtn.textContent='▶';playBtn.setAttribute('aria-label','播放');});
    audio.addEventListener('loadedmetadata',()=>{document.getElementById('duration').textContent=format(audio.duration);});
    audio.addEventListener('timeupdate',()=>{document.getElementById('currentTime').textContent=format(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)seek.value=100*audio.currentTime/audio.duration;});
    seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(seek.value)/100;});
    document.getElementById('volume').addEventListener('input',e=>audio.volume=Number(e.target.value));
    audio.addEventListener('ended',()=>loadSong(current+1,true));
    audio.addEventListener('error',()=>{message.textContent='音檔讀取失敗：請確認 '+songs[current].file+' 已上傳。';});
    audio.volume=0.8;
    loadSong(0);
  </script>
</body>
</html>
